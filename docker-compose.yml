# Banco de dados do projeto (somente para desenvolvimento)
# Subir:   docker compose up -d
# Parar:   docker compose down
services:
  postgres:
    image: postgres:15-alpine
    container_name: oficina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina
      POSTGRES_DB: oficina
    ports:
      - "5434:5432"
    volumes:
      - oficina-dados:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  oficina-dados:
